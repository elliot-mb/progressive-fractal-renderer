<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Fractal Explorer</title>
    <link rel="stylesheet" type="text/css" href="../css/renderer.css">
    <link rel="icon" type="image/x-icon" href="../images/logo_trispoke_32x32.ico">
</head>
<body>
    <div id="container">
      <div class="overlap">
        <canvas id="canvas" width="1000" height="1000" defer>
        </canvas>
        <div class="text-box">
          <p class="status-text" 
             id="stop-button" 
             onclick="stop()">
             Running tests...
          </p>
          <p>
            'A' and 'D' to rotate offset<br>
            'S' to switch render mode<br>
            'W' to stop iteration increase<br>
            'E' to resume iteration increase<br>
            'R' to increase the radius of offset<br>
            'F' to decrease the radius of offset<br>
            Drag to pan<br>
            Scroll to zoom
          </p>
        </div>

        <!-- Must be run before utils, which sets all the constants like width and height. -->
        <script src="../src/viewport_manager.js"></script>

        <!-- ######################################################## 
             ###                 Source modules                   ###
             ######################################################## -->        
        <script src="../src/rgba.js"></script>
        <script src="../src/utils.js"></script>
        <script src="../src/coord.js"></script>
        <script src="../src/key_handler.js"></script>
        <script src="../src/cursor_handler.js"></script>
        <script src="../src/complex.js"></script>        
        <script src="../src/text_display.js"></script>
        <script src="../src/fractal_painter.js"></script>

        <script src="../src/filler.js"></script>

        
        <!-- ######################################################## 
             ### Uncomment test scripts to unit-test the program. ### 
             ######################################################## -->
        <script src="../test/testing_lib.js"></script>
        <script src="../test/unit/test_maths.js"></script>
        <script src="../test/unit/test_pointer_lock.js"></script>
        <script src="../test/unit/test_coordinate.js"></script>
        <!-- Next test. -->
        <script src="../test/test.js"></script>

        <!-- ######################################################## 
             ###             Uncomment to run main.               ### 
             ######################################################## -->
        <script src="../src/main.js" defer></script>
      </div>
    </div>
</body>
</html>
