<script>
  const RESOLUTION_SELECTOR = () => document.getElementById('resolution');
  const RENDERER_ANCHOR     = () => document.getElementById('renderer-link');
  const RENDER_LINK_TEXT    = () => `renderer/index.html?resolution=`;

  RESOLUTION_SELECTOR().addEventListener("click", set_renderer_link, false);

  function set_renderer_link()
  {
    RENDERER_ANCHOR().setAttribute('href', get_renderer_link());
  }

  function get_renderer_link()
  {
    return RENDER_LINK_TEXT() + RESOLUTION_SELECTOR().value;
  }

  /* Run on page load to reflect default option. */
  set_renderer_link();
</script>
